name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host --parallel 2

  miyoo-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build OnionOS package
        run: ./tools/build-onion.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RetroBackup-onionos
          path: |
            dist/RetroBackup-onionos.zip
            dist/SHA256SUMS
